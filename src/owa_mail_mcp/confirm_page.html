<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{t:confirm.title}}</title>
<style nonce="{{NONCE}}">
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
  --accent: #0a66d8; --accent-text: #ffffff; --danger: #c62828; --danger-bg: #fdecea;
  --warn-bg: #fff4d6; --warn-text: #7a5300; --ok: #1b7f3b; --chip: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --card: #232326; --text: #f2f2f4; --muted: #a1a1a6; --line: #3a3a3e;
    --accent: #3b8cff; --accent-text: #ffffff; --danger: #ff6b6b; --danger-bg: #3a1f1f;
    --warn-bg: #3a3218; --warn-text: #f5d27a; --ok: #5fd38a; --chip: #2f2f33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .sub { color: var(--muted); font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: var(--danger); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.card.pending { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 12px; }
.who { font-weight: 600; }
.timer { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.timer.low { color: var(--danger); font-weight: 600; }
.row { display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 4px 0; align-items: start; }
.row .k { color: var(--muted); font-size: 13px; padding-top: 3px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; word-break: break-all; }
.chip.ext { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
.subject { font-weight: 600; word-break: break-word; }
pre.body { white-space: pre-wrap; word-break: break-word; font: inherit; background: var(--bg); border-radius: 8px; padding: 12px; margin: 10px 0 0; max-height: 50vh; overflow: auto; }
.reply { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
.warn ul { margin: 0; padding-left: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button { font: inherit; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
label { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
textarea { min-height: 220px; resize: vertical; }
textarea.short { min-height: 110px; }
.err { color: var(--danger); margin-top: 10px; font-size: 13px; }
.done { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.done .s { white-space: nowrap; font-size: 13px; }
.s.sent { color: var(--ok); } .s.failed, .s.expired { color: var(--danger); } .s.rejected, .s.cancelled { color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 32px 0; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 26px 0 8px; }
.old { text-decoration: line-through; color: var(--muted); }
.new { font-weight: 600; color: var(--ok); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
</style>
</head>
<body>
<main>
  <header>
    <span class="dot" id="dot"></span>
    <div>
      <h1>{{t:confirm.h1}}</h1>
      <div class="sub">{{t:confirm.sub}}</div>
    </div>
  </header>
  <section id="pending"></section>
  <h2 id="history-title" hidden>{{t:confirm.history}}</h2>
  <section id="history"></section>
</main>
<script nonce="{{NONCE}}">
"use strict";
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const I18N = {{I18N}};
const T = (key, vars) => (I18N["confirm." + key] ?? I18N[key] ?? key).replace(/\{(\w+)\}/g, (m, k) => vars && k in vars ? String(vars[k]) : m);
// A message from the server in the user's language when it carries a code; its English text otherwise.
const said = (text, code, params) => code && I18N["policy." + code] ? T("policy." + code, params) : text;
const editing = new Map();   // id -> draft being edited, so polling does not wipe what the user types
const errors = new Map();
let lastPendingIds = "";

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}

function chips(list, external) {
  const ext = new Set((external || []).map(e => e.toLowerCase()));
  return el("div", { class: "chips" }, list.map(a => el("span", { class: "chip" + (ext.has(a.toLowerCase()) ? " ext" : ""),
    title: ext.has(a.toLowerCase()) ? T("external_title") : "" }, a + (ext.has(a.toLowerCase()) ? " · " + T("external") : ""))));
}

async function decide(id, action, edits) {
  errors.delete(id);
  try {
    const res = await fetch(base + "api/decide", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, action, edits }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) errors.set(id, said(data.error || ("HTTP " + res.status), data.code, data.params));
    else editing.delete(id);
  } catch (e) { errors.set(id, String(e)); }
  refresh(true);
}

// The approving button wakes up 3 seconds after a card first appears: time to read who gets what,
// and a stray click (or a click-jacking overlay) cannot fire it. "Don't send" works at once.
const ARM_MS = 3000;
const firstSeen = new Map();
function approveButton(id, label, act) {
  if (!firstSeen.has(id)) firstSeen.set(id, Date.now());
  const b = el("button", { class: "primary", "data-ready-at": String(firstSeen.get(id) + ARM_MS), "data-label": label,
    onclick: () => { if (Number(b.dataset.readyAt) > Date.now()) return; b.dataset.done = "1"; arm(b); act(); } }, label);
  arm(b);
  return b;
}
function arm(b) {
  const left = Math.ceil((Number(b.dataset.readyAt) - Date.now()) / 1000);
  b.disabled = left > 0 || b.dataset.done === "1";
  b.textContent = left > 0 ? `${b.dataset.label} · ${left}` : b.dataset.label;
}
setInterval(() => document.querySelectorAll("button[data-ready-at]").forEach(arm), 200);

const when = (iso) => new Date(iso).toLocaleString(document.documentElement.lang, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const timeOnly = (iso) => new Date(iso).toLocaleTimeString(document.documentElement.lang, { hour: "2-digit", minute: "2-digit" });
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const span = (start, end) => start ? when(start) + " – " + (end ? (sameDay(start, end) ? timeOnly(end) : when(end)) : "") : "";

// Local "YYYY-MM-DDTHH:MM" for a datetime-local input, from the server's ISO time with its offset.
const localInput = (iso) => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const emails = (list) => (list || []).map(p => p.email || p.name).filter(Boolean);

function meetingEditor(item, draft) {
  const a = item.action;
  const field = (key, label, kind) => {
    const input = kind === "area" ? el("textarea", { class: "short" }) : el("input", { type: kind || "text" });
    input.value = draft[key];
    input.addEventListener("input", () => { draft[key] = input.value; });
    return [el("label", {}, label), input];
  };
  const fields = a.kind === "reschedule"
    ? [...field("new_start", T("field_start"), "datetime-local"), ...field("new_end", T("field_end"), "datetime-local")]
    : [...field("subject", T("field_subject")), ...field("start", T("field_start"), "datetime-local"), ...field("end", T("field_end"), "datetime-local"),
       ...field("location", T("location")), ...field("attendees", T("attendees")), ...field("optional_attendees", T("optional_attendees")),
       ...field("note", T("field_agenda"), "area")];
  return a.kind === "reschedule" ? [el("div", { class: "subject" }, a.event.subject), ...fields] : fields;
}

function actionCard(item) {
  const a = item.action, ev = a.event;
  const timer = el("span", { class: "timer" + (item.seconds_left <= 10 ? " low" : ""), "data-id": item.id }, T("seconds", { n: item.seconds_left }));
  const people = emails(ev.attendees), optional = emails(ev.optional_attendees);
  const head = el("div", { class: "top" }, el("div", { class: "who" }, T("asks_" + a.kind, { client: item.client || T("mcp_client") })), timer);
  const draft = editing.get(item.id);
  if (draft) {
    const card = el("div", { class: "card pending" }, head, ...meetingEditor(item, draft));
    card.append(el("div", { class: "actions" },
      approveButton(item.id, T("do_" + a.kind), () => decide(item.id, "approve", draft)),
      el("button", { onclick: () => { editing.delete(item.id); render(window.__items || [], true); } }, T("cancel_edits")),
      el("button", { onclick: () => decide(item.id, "reject") }, T("dont_change"))));
    if (errors.has(item.id)) card.append(el("div", { class: "err" }, errors.get(item.id)));
    return card;
  }
  const card = el("div", { class: "card pending" },
    head,
    el("div", {},
      el("div", { class: "row" }, el("div", { class: "k" }, T("meeting")), el("div", { class: "subject" }, ev.subject)),
      el("div", { class: "row" }, el("div", { class: "k" }, T("when")),
        el("div", { class: a.kind === "reschedule" ? "old" : "" }, span(ev.start, ev.end))),
      a.kind === "reschedule" ? el("div", { class: "row" }, el("div", { class: "k" }, T("new_time")), el("div", { class: "new" }, span(a.new_start, a.new_end))) : null,
      ev.location ? el("div", { class: "row" }, el("div", { class: "k" }, T("location")), el("div", {}, ev.location)) : null,
      ev.organizer && !ev.i_am_organizer ? el("div", { class: "row" }, el("div", { class: "k" }, T("organizer")), el("div", {}, ev.organizer.name || ev.organizer.email)) : null,
      people.length ? el("div", { class: "row" }, el("div", { class: "k" }, T("attendees")), chips(people, item.external)) : null,
      optional.length ? el("div", { class: "row" }, el("div", { class: "k" }, T("optional_attendees")), chips(optional, item.external)) : null,
      a.note ? el("pre", { class: "body" }, a.note) : null));
  const notes = [
    ...(a.kind === "cancel" ? [T("notify_cancel")] : a.kind === "decline" ? [T("notify_decline")]
        : a.kind === "reschedule" && people.length ? [T("notify_reschedule")] : a.kind === "create" && people.length + optional.length ? [T("notify_create")] : []),
    ...(item.external.length ? [T("external_count", { n: item.external.length })] : []),
    ...(ev.repeats ? [T("only_occurrence")] : []),
  ];
  if (notes.length) card.append(el("div", { class: "warn" }, el("ul", {}, notes.map(w => el("li", {}, w)))));
  const startEdit = () => {
    editing.set(item.id, a.kind === "reschedule"
      ? { new_start: localInput(a.new_start), new_end: localInput(a.new_end) }
      : { subject: ev.subject, start: localInput(ev.start), end: localInput(ev.end), location: ev.location || "",
          attendees: people.join(", "), optional_attendees: optional.join(", "), note: a.note || "" });
    render(window.__items || [], true);
  };
  card.append(el("div", { class: "actions" },
    approveButton(item.id, T("do_" + a.kind), () => decide(item.id, "approve")),
    a.kind === "create" || a.kind === "reschedule" ? el("button", { onclick: startEdit }, T("edit")) : null,
    el("button", { onclick: () => decide(item.id, "reject") }, T("dont_change"))));
  if (errors.has(item.id)) card.append(el("div", { class: "err" }, errors.get(item.id)));
  return card;
}

function pendingCard(item) {
  if (item.action) return actionCard(item);
  const m = item.message;
  const draft = editing.get(item.id);
  const timer = el("span", { class: "timer" + (item.seconds_left <= 10 ? " low" : ""), "data-id": item.id }, T("seconds", { n: item.seconds_left }));
  const card = el("div", { class: "card pending" },
    el("div", { class: "top" },
      el("div", { class: "who" }, T("asks", { client: item.client || T("mcp_client") })), timer),
    item.reply_context ? el("div", { class: "reply" }, T(item.reply_context.forward ? "forward_of" : "reply_to", { subject: item.reply_context.subject, from: item.reply_context.from || "?" })) : null);

  if (draft) {
    const f = {};
    const field = (key, label, multiline) => {
      const input = multiline ? el("textarea", {}) : el("input", { type: "text" });
      input.value = draft[key];
      input.addEventListener("input", () => { draft[key] = input.value; });
      f[key] = input;
      return [el("label", {}, label), input];
    };
    card.append(...field("to", T("field_to")), ...field("cc", T("field_cc")), ...field("bcc", T("field_bcc")),
                ...field("subject", T("field_subject")), ...field("body", T("field_body"), true));
    card.append(el("div", { class: "actions" },
      approveButton(item.id, T("send_edited"), () => decide(item.id, "approve", draft)),
      el("button", { onclick: () => { editing.delete(item.id); render(window.__items || [], true); } }, T("cancel_edits")),
      el("button", { onclick: () => decide(item.id, "reject") }, T("dont_send"))));
  } else {
    card.append(el("div", {},
      el("div", { class: "row" }, el("div", { class: "k" }, T("from")), el("div", {}, item.from || "")),
      el("div", { class: "row" }, el("div", { class: "k" }, T("to")), chips(m.to, item.external)),
      m.cc.length ? el("div", { class: "row" }, el("div", { class: "k" }, T("cc")), chips(m.cc, item.external)) : null,
      m.bcc.length ? el("div", { class: "row" }, el("div", { class: "k" }, T("bcc")), chips(m.bcc, item.external)) : null,
      el("div", { class: "row" }, el("div", { class: "k" }, T("subject")), el("div", { class: "subject" }, m.subject)),
      item.reply_context && item.reply_context.forward && item.reply_context.attachments.length
        ? el("div", { class: "row" }, el("div", { class: "k" }, T("attachments")), el("div", {}, item.reply_context.attachments.join(", "))) : null,
      m.body ? el("pre", { class: "body" }, m.body) : null));
    const warnings = [...(item.external.length ? [T("external_count", { n: item.external.length })] : []),
                      ...item.warnings.map((w, i) => said(w, (item.warning_codes || [])[i]))];
    if (warnings.length) card.append(el("div", { class: "warn" }, el("ul", {}, warnings.map(w => el("li", {}, w)))));
    card.append(el("div", { class: "actions" },
      approveButton(item.id, T("send"), () => decide(item.id, "approve")),
      el("button", { onclick: () => { editing.set(item.id, { to: m.to.join(", "), cc: m.cc.join(", "), bcc: m.bcc.join(", "), subject: m.subject, body: m.body }); render(window.__items || [], true); } }, T("edit")),
      el("button", { onclick: () => decide(item.id, "reject") }, T("dont_send"))));
  }
  if (errors.has(item.id)) card.append(el("div", { class: "err" }, errors.get(item.id)));
  return card;
}

function historyRow(item) {
  if (item.action) {
    const a = item.action;
    const status = item.status === "sent" ? T("done_" + a.kind) + (item.via === "chat" ? " · " + T("status_sent_chat") : "")
      : I18N["confirm.action_" + item.status] || I18N["confirm.status_" + item.status] || item.status;
    return el("div", { class: "card done" },
      el("div", { class: "ell" }, el("span", { class: "subject" }, a.event.subject), " · ", span(a.new_start || a.event.start, a.new_end || a.event.end), item.edited ? T("edited_suffix") : ""),
      el("div", { class: "s " + item.status }, status, item.error ? `: ${item.error}` : ""));
  }
  const m = item.message;
  return el("div", { class: "card done" },
    el("div", { class: "ell" }, el("span", { class: "subject" }, m.subject), " → ", m.to.join(", "), item.edited ? T("edited_suffix") : ""),
    el("div", { class: "s " + item.status }, (item.auto && item.status === "sent" ? T("status_sent_auto") : I18N["confirm.status_" + item.status] || item.status), item.error ? `: ${item.error}` : ""));
}

function render(items, force) {
  window.__items = items;
  const pending = items.filter(i => i.status === "pending");
  const ids = pending.map(i => i.id).join(",");
  const pendingBox = document.getElementById("pending");
  // While the user edits, only the timers move: re-rendering would steal the cursor. `force`: the user opened or left an editor.
  if (!force && ids === lastPendingIds && editing.size) {
    for (const i of pending) {
      const t = pendingBox.querySelector(`.timer[data-id="${i.id}"]`);
      if (t) { t.textContent = T("seconds", { n: i.seconds_left }); t.className = "timer" + (i.seconds_left <= 10 ? " low" : ""); }
    }
  } else {
    pendingBox.replaceChildren(...(pending.length ? pending.map(pendingCard) : [el("div", { class: "empty" }, T("empty"))]));
  }
  lastPendingIds = ids;
  for (const id of [...editing.keys()]) if (!pending.some(i => i.id === id)) editing.delete(id);
  const done = items.filter(i => i.status !== "pending");
  document.getElementById("history-title").hidden = !done.length;
  document.getElementById("history").replaceChildren(...done.slice(0, 10).map(historyRow));
  document.title = pending.length ? T("title_pending", { n: pending.length }) : T("title");
}

async function refresh(force) {
  try {
    const res = await fetch(base + "api/pending", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    document.getElementById("dot").classList.remove("off");
    render(data.items, force);
  } catch (e) {
    document.getElementById("dot").classList.add("off");
  }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
