[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owa-mail-mcp"
version = "0.9.0"
description = "MCP server for Exchange / OWA mail: check, search, read threads, find senders, send only after the user confirms in a local window."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "exchangelib>=5.4,<6",
    "keyring>=24",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
owa-mail-mcp = "owa_mail_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
artifacts = ["src/owa_mail_mcp/*.html", "src/owa_mail_mcp/locales/*.json"]
packages = ["src/owa_mail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
